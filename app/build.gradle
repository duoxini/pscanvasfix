plugins {
    id 'com.android.application'
}

android {
    namespace 'com.color.pscanvasfix'
    compileSdk 35

    defaultConfig {
        applicationId 'com.color.pscanvasfix'
        minSdk 33
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'BlockedPrivateApi'
    }

    testOptions {
        unitTests {
            all { test ->
                // Forward pscanvas.* system properties (e.g. -Dpscanvas.apk.dir)
                // to the unit test JVM for the offline Resolver verification.
                test.systemProperties.putAll(
                        System.properties.findAll { k, v ->
                            k.toString().startsWith('pscanvas.')
                        })
            }
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
    testImplementation 'junit:junit:4.13.2'
}
