plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.color.pscanvasfix'
    // libxposed service 102 declares minCompileSdk 37. The installed Android 17
    // platform uses the new minor-API target hash; targetSdk remains 35.
    compileSdkVersion 'android-37.0'

    defaultConfig {
        applicationId 'com.color.pscanvasfix'
        minSdk 33
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    lint {
        disable 'BlockedPrivateApi'
    }

    testOptions {
        unitTests {
            all { test ->
                // Forward pscanvas.* system properties (e.g. -Dpscanvas.apk.dir)
                // to the unit test JVM for the offline Resolver verification.
                test.systemProperties.putAll(
                        System.properties.findAll { k, v ->
                            k.toString().startsWith('pscanvas.')
                        })
            }
        }
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.7.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.4'
    implementation 'androidx.compose.material3:material3:1.3.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.4'

    testImplementation 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
